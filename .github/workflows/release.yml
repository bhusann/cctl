name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to attach the built release assets to
        required: false
        type: string
      notes_only:
        description: Update release notes only (skip build and asset checks)
        required: false
        default: false
        type: boolean
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.notes_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For manual dispatch, build the selected source ref (such as master)
          # and attach the assets to release_tag. Release and tag events build
          # the tagged commit directly.
          ref: ${{ github.ref }}

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build cctl binary (no-NVIDIA)
        run: make cctl

      # Attach the FINISHED tarball exactly as it exists in the mirror repo
      # (never rebuilt here) — see
      # https://github.com/bhusann/tuxedo-drivers-cctl-mirror
      - name: Fetch drivers.tar.gz from the mirror repo
        run: |
          curl -fsSL --connect-timeout 10 -o drivers.tar.gz \
            https://raw.githubusercontent.com/bhusann/tuxedo-drivers-cctl-mirror/main/drivers.tar.gz
          # Refuse to publish a tarball the cctl binary would reject: the
          # The constant may be in cctl.c or an included source fragment.
          expected=$(grep -h '^#define DRIVERS_SHA256' cctl.c cctl_*.inc 2>/dev/null | \
            sed -n 's/^#define DRIVERS_SHA256[[:space:]]*"\([0-9a-f]\{64\}\)".*/\1/p')
          actual=$(sha256sum drivers.tar.gz | cut -d' ' -f1)
          echo "baked:  $expected"
          echo "mirror: $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::mirror drivers.tar.gz does not match DRIVERS_SHA256 in the cctl sources"
            exit 1
          fi

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            cctl
            drivers.tar.gz

  release-notes:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.notes_only && inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate release notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
