name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build cctl binary
        run: gcc -o cctl cctl.c -Os -s

      - name: Package drivers source tarball
        run: |
          tar -czf cctl-drivers.tar.gz \
            --exclude='*.o' --exclude='*.ko' --exclude='*.mod.c' --exclude='*.cmd' \
            --exclude='modules.order' --exclude='Module.symvers' --exclude='*.markers' \
            --exclude='.tmp_versions' --exclude='build' --exclude='usr' --exclude='.tmp_*' \
            drivers

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cctl
            cctl-drivers.tar.gz
